<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <defs>
    <!-- Smooth fluttering fabric silhouette -->
    <clipPath id="etWaveClip">
      <path d="M 8 18 C 72 6, 134 26, 198 14 C 258 3, 308 18, 350 10 L 344 198 C 300 206, 250 191, 194 202 C 132 214, 70 194, 8 206 Z" />
    </clipPath>
    <!-- 3D fabric fold highlight & shadow gradient -->
    <linearGradient id="etClothSheen" x1="0%" y1="0%" x2="100%" y2="12%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="14%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.18" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="66%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="etBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <!-- Flag cloth clipped to wavy silhouette (100% transparent outside) -->
  <g clip-path="url(#etWaveClip)">
    <!-- Green top stripe -->
    <rect x="0" y="0" width="360" height="75" fill="#078930" />
    <!-- Yellow middle stripe -->
    <rect x="0" y="75" width="360" height="72" fill="#fcdd09" />
    <!-- Red bottom stripe -->
    <rect x="0" y="147" width="360" height="73" fill="#da121a" />

    <!-- Centered Ethiopian Royal-Blue Emblem Circle -->
    <circle cx="180" cy="111" r="46" fill="#0f47af" />

    <!-- Golden Five-Pointed Pentagram Star (Interlaced Lines) -->
    <g stroke="#fcdd09" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <!-- Outer pentagram lines -->
      <line x1="180" y1="74" x2="158.3" y2="140.9" />
      <line x1="158.3" y1="140.9" x2="215.2" y2="99.6" />
      <line x1="215.2" y1="99.6" x2="144.8" y2="99.6" />
      <line x1="144.8" y1="99.6" x2="201.7" y2="140.9" />
      <line x1="201.7" y1="140.9" x2="180" y2="74" />
      <!-- Radiant golden rays between star points -->
      <line x1="180" y1="126" x2="180" y2="149" />
      <line x1="194" y1="115" x2="216" y2="122" />
      <line x1="189" y1="98" x2="203" y2="80" />
      <line x1="171" y1="98" x2="157" y2="80" />
      <line x1="166" y1="115" x2="144" y2="122" />
    </g>

    <!-- Subtle stitched hoist sleeve -->
    <rect x="8" y="0" width="9" height="220" fill="#000000" fill-opacity="0.14" />
    <!-- Realistic silk folds lighting overlay -->
    <rect x="0" y="0" width="360" height="220" fill="url(#etClothSheen)" />
  </g>

  <!-- Brass grommets for mounting onto metallic pole -->
  <circle cx="14" cy="27" r="3.6" fill="url(#etBrass)" stroke="#422006" stroke-width="0.8" />
  <circle cx="14" cy="27" r="1.5" fill="none" stroke="#fef9c3" stroke-width="0.6" />
  <circle cx="14" cy="197" r="3.6" fill="url(#etBrass)" stroke="#422006" stroke-width="0.8" />
  <circle cx="14" cy="197" r="1.5" fill="none" stroke="#fef9c3" stroke-width="0.6" />
</svg>
